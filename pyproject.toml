[project]
name = "hwp-parse-bench"
version = "0.1.0"
description = "HWP·HWPX 파서를 원본 파일로 비교하는 공개 벤치마크 (RAG용 구조 충실도)"
readme = "README.md"
license = "MIT"
authors = [{ name = "hall7024", email = "38268528+hall7024@users.noreply.github.com" }]
requires-python = ">=3.12"
dependencies = [
    "apted>=1.0.3",
    "lxml>=6.1.3",
    "markdown-it-py>=4.2.0",
    "pypdf>=6.21.4",
    "rapidfuzz>=3.14.6",
    "scipy>=1.18.1",
]

[project.scripts]
hwpbench = "hwpbench.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hwpbench"

[tool.uv]
# 새로 올라온 지 일주일이 안 된 버전은 받지 않는다 (공급망 공격 대비)
exclude-newer = "7 days"
# 시스템 Python(ssl 없이 빌드된 pyenv 등)을 피하고 같은 Python을 쓴다
python-preference = "only-managed"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]
# 순위표 머리글과 설명 문장
"src/hwpbench/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
